<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>صفحة التعليقات</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='feedback.css') }}"
    />
    <link rel="icon" href=".\static\images\gra.png" type="icon" />
  </head>
  <body>
    <header class="header">
      <div class="header-container">
        <img
          src="{{ url_for('static', filename='images/learing.png') }}"
          alt="Logo"
          class="logo"
        />
        <a href="{{ url_for('home') }}" target="_blank">الخروج </a>
      </div>
    </header>

    <div class="feedback-container">
      {% with messages = get_flashed_messages() %} {% if messages %}
      <ul class="messages">
        {% for message in messages %}
        <li>{{ message }}</li>
        {% endfor %}
      </ul>
      {% endif %} {% endwith %}
      <h2 class="main-title">اذكر ملاحظاتك هنا</h2>

      <form method="POST" class="feedback-form">
        <textarea name="message" required></textarea><br />
        <button type="submit">إرسال</button>
      </form>
    </div>
  </body>
</html>
